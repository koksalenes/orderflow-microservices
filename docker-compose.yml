name: orderflow

# `make infra-up` starts the infrastructure only; `make up` also builds and starts the services behind the YARP gateway.
# `make start` runs the same stack from the prebuilt images on GHCR (ORDERFLOW_IMAGE_PREFIX / ORDERFLOW_IMAGE_TAG), without building.

x-app: &app
  profiles: [apps]
  restart: unless-stopped
  stop_grace_period: 40s
  depends_on:
    postgres:
      condition: service_healthy

x-app-environment: &app-environment
  ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Production}
  TrustedProxy__KnownProxies__0: ${GATEWAY_IP:-10.201.0.10}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
  # Products and Inventory apply their EF Core migrations and seed data on startup.
  Database__MigrateOnStartup: "true"


services:
  postgres:
    image: postgres:18.3
    profiles: [infra]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Database created once by scripts/postgres/init-db.sh.
      APP_DATABASES: products_db inventory_db orders_db payments_db notifications_db keycloak_db
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./scripts/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    profiles: [infra]
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}
      RABBITMQ_DEFAULT_VHOST: orderflow
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.2.13-alpine
    profiles: [infra]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: ${ORDERFLOW_IMAGE_PREFIX:-orderflow}/keycloak:${ORDERFLOW_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/keycloak/Dockerfile
    profiles: [infra]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set KEYCLOAK_ADMIN_USER in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KEYCLOAK_BFF_CLIENT_SECRET: ${KEYCLOAK_BFF_CLIENT_SECRET:?set KEYCLOAK_BFF_CLIENT_SECRET in .env (make env)}
      KC_HTTP_PORT: "8080"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./deploy/keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.1
    profiles: [infra]
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "${ASPIRE_DASHBOARD_PORT:-18888}:18888"
      - "${OTLP_GRPC_PORT:-4317}:18889"
      - "${OTLP_HTTP_PORT:-4318}:18890"
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.5
    profiles: [infra]
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  gateway:
    profiles: [apps]
    image: ${ORDERFLOW_IMAGE_PREFIX:-orderflow}/gateway:${ORDERFLOW_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT: src/Gateway/OrderFlow.Gateway
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Production}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      TrustedProxy__KnownProxies__0: ${BFF_IP:-10.201.0.11}
      ReverseProxy__Clusters__products__Destinations__primary__Address: http://products-api:8080
      ReverseProxy__Clusters__inventory__Destinations__primary__Address: http://inventory-api:8080
      ReverseProxy__Clusters__orders__Destinations__primary__Address: http://orders-api:8080
      ReverseProxy__Clusters__payments__Destinations__primary__Address: http://payments-api:8080
      ReverseProxy__Clusters__notifications__Destinations__primary__Address: http://notifications-api:8080
    ports:
      - "${GATEWAY_PORT:-8000}:8080"
    networks:
      default:
        ipv4_address: ${GATEWAY_IP:-10.201.0.10}

  bff:
    profiles: [apps]
    image: ${ORDERFLOW_IMAGE_PREFIX:-orderflow}/bff:${ORDERFLOW_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/bff/Dockerfile
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Production}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      Oidc__Authority: http://localhost:${KEYCLOAK_PORT:-8080}/realms/orderflow
      Oidc__MetadataAddress: http://keycloak:8080/realms/orderflow/.well-known/openid-configuration
      Oidc__ClientSecret: ${KEYCLOAK_BFF_CLIENT_SECRET:?set KEYCLOAK_BFF_CLIENT_SECRET in .env (make env)}
      Oidc__RequireHttpsMetadata: "false"
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD}
      ReverseProxy__Clusters__gateway__Destinations__primary__Address: http://gateway:8080
    ports:
      - "${WEB_PORT:-3000}:8080"
    networks:
      default:
        ipv4_address: ${BFF_IP:-10.201.0.11}
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy


  products-api:
    <<: *app
    image: ${ORDERFLOW_IMAGE_PREFIX:-orderflow}/products-api:${ORDERFLOW_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT: src/Services/Products/OrderFlow.Products.Api
    environment:
      <<: *app-environment
      Database__ConnectionString: Host=postgres;Database=products_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Kestrel__Endpoints__Http__Url: http://+:8080
      Kestrel__Endpoints__Grpc__Url: http://+:8081
      Kestrel__Endpoints__Grpc__Protocols: Http2

  products-worker:
    <<: *app
    image: ${ORDERFLOW_IMAGE_PREFIX:-orderflow}/products-worker:${ORDERFLOW_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT: src/Services/Products/OrderFlow.Products.Worker
    environment:
      <<: *app-environment
      Database__ConnectionString: Host=postgres;Database=products_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}

  inventory-api:
    <<: *app
    image: ${ORDERFLOW_IMAGE_PREFIX:-orderflow}/inventory-api:${ORDERFLOW_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT: src/Services/Inventory/OrderFlow.Inventory.Api
    environment:
      <<: *app-environment
      Database__ConnectionString: Host=postgres;Database=inventory_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}

  inventory-worker:
    <<: *app
    image: ${ORDERFLOW_IMAGE_PREFIX:-orderflow}/inventory-worker:${ORDERFLOW_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT: src/Services/Inventory/OrderFlow.Inventory.Worker
    environment:
      <<: *app-environment
      Database__ConnectionString: Host=postgres;Database=inventory_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_DEFAULT_USER}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  orders-api:
    <<: *app
    image: ${ORDERFLOW_IMAGE_PREFIX:-orderflow}/orders-api:${ORDERFLOW_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT: src/Services/Orders/OrderFlow.Orders.Api
    environment:
      <<: *app-environment
      Database__ConnectionString: Host=postgres;Database=orders_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Authentication__Authority: http://localhost:${KEYCLOAK_PORT:-8080}/realms/orderflow
      Authentication__MetadataAddress: http://keycloak:8080/realms/orderflow/.well-known/openid-configuration
      Authentication__RequireHttpsMetadata: "false"
      Services__ProductsGrpc: http://products-api:8081

  orders-worker:
    <<: *app
    image: ${ORDERFLOW_IMAGE_PREFIX:-orderflow}/orders-worker:${ORDERFLOW_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT: src/Services/Orders/OrderFlow.Orders.Worker
    environment:
      <<: *app-environment
      Database__ConnectionString: Host=postgres;Database=orders_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_DEFAULT_USER}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payments-api:
    <<: *app
    image: ${ORDERFLOW_IMAGE_PREFIX:-orderflow}/payments-api:${ORDERFLOW_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT: src/Services/Payments/OrderFlow.Payments.Api
    environment:
      <<: *app-environment
      Database__ConnectionString: Host=postgres;Database=payments_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # JWT validation: issuer as the browser sees Keycloak, keys fetched over the compose network.
      Authentication__Authority: http://localhost:${KEYCLOAK_PORT:-8080}/realms/orderflow
      Authentication__MetadataAddress: http://keycloak:8080/realms/orderflow/.well-known/openid-configuration
      Authentication__RequireHttpsMetadata: "false"

  payments-worker:
    <<: *app
    image: ${ORDERFLOW_IMAGE_PREFIX:-orderflow}/payments-worker:${ORDERFLOW_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT: src/Services/Payments/OrderFlow.Payments.Worker
    environment:
      <<: *app-environment
      Database__ConnectionString: Host=postgres;Database=payments_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_DEFAULT_USER}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notifications-api:
    <<: *app
    image: ${ORDERFLOW_IMAGE_PREFIX:-orderflow}/notifications-api:${ORDERFLOW_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT: src/Services/Notifications/OrderFlow.Notifications.Api
    environment:
      <<: *app-environment
      Database__ConnectionString: Host=postgres;Database=notifications_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}

  notifications-worker:
    <<: *app
    image: ${ORDERFLOW_IMAGE_PREFIX:-orderflow}/notifications-worker:${ORDERFLOW_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        PROJECT: src/Services/Notifications/OrderFlow.Notifications.Worker
    environment:
      <<: *app-environment
      Database__ConnectionString: Host=postgres;Database=notifications_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_DEFAULT_USER}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS}
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      Storefront__BaseUrl: http://localhost:${WEB_PORT:-3000}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:

networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-10.201.0.0/24}
          ip_range: ${DOCKER_DYNAMIC_IP_RANGE:-10.201.0.128/25}
